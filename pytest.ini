[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Pure unit tests with no I/O
    integration: Tests that combine multiple modules
    e2e: End-to-end pipeline tests
    slow: Tests that take more than 5 seconds
